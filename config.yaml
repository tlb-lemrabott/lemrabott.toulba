params:
  # theme
  showToc: true
  TocOpen: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  hideMeta: false

  # for enchanced SEO
  env: production

  # Home Page
  profileMode:
    enabled: true
    title: "Lemrabott Toulba"
    role: "Principal Software Engineer"
    now: "Currently at Fidelity Investments"
    years: "8+ years"
    education: "M.S. Computer Science, Maharishi International University"
    text: "I design and build scalable enterprise applications, integrate systems through APIs and event-driven messaging, develop batch processing solutions, and modernize legacy software."
    skills:
      - Java
      - Spring Boot
      - Kafka
      - AWS
    highlights:
      - org: Fidelity Investments
        title: Financial integrations and modernization
        period: 2025 — Present
        tags: ["Java", "Spring Boot", "Kafka", "AWS"]
        url: /experience/fidelity/
    focus:
      - title: Enterprise integration
        text: REST APIs for financial systems, including external authentication, database connectivity, and money movement workflows.
      - title: Backend platforms
        text: Java, Spring Boot, and Spring Batch, including modernization of existing applications and their build dependencies.
      - title: Event-driven systems
        text: Kafka, RabbitMQ, and microservices for workflows that have to stay reliable in production.
      - title: Cloud delivery
        text: AWS, including ECS, EventBridge, and CloudWatch, with Jenkins and GitHub Actions, and Datadog for production monitoring.
    # buttons:
    #   - name: Resume
    #     url: ""

  # List View
  hideDescriptionInList: false

  # cover image for posts
  cover:
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  socialIcons:
    - name: "phone"
      url: "+19293369859"
    - name: "email"
      url: "mailto:lemrabott.toulba@gmail.com"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/lemrabott-toulba"
    - name: "github"
      url: "https://github.com/tlb-lemrabott/"
    - name: "resume"
      url: "mailto:lemrabott.toulba@gmail.com"

  # text search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

# for search using Fuse.js
outputs:
  home:
    - HTML
    - RSS
    - JSON

# allow HTML in MD
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: false
